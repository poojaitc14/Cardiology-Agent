version: 0.2

env:
  variables:
    AWS_REGION: eu-west-2
    ECR_REPO: ci-cd-pooja-frontend
    AWS_ACCOUNT_ID: 666127452756
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo "Checking AWS identity..."
      - aws sts get-caller-identity
      - echo "Listing ECR repos..."
      - aws ecr describe-repositories --region $AWS_REGION || echo "No repos or no access"

      - echo "Logging into ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $ECR_REPO -f Dockerfile.frontend .

      - echo "Tagging image..."
      - docker tag $ECR_REPO:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing image..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

      - echo "Writing imagedefinitions.json..."
      - printf '[{"name":"Main","imageUri":"%s"}]' $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG > imagedefinitions.json

      - echo "Building taskdef.json from the currently registered task definition..."
      - aws ecs describe-task-definition --task-definition ci-cd-pooja-frontend --query 'taskDefinition' > raw-taskdef.json
      - >
        python3 -c "
        import json;
        d = json.load(open('raw-taskdef.json'));
        d['containerDefinitions'][0]['image'] = '$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG';
        [d.pop(k, None) for k in ('taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy')];
        json.dump(d, open('taskdef.json', 'w'))
        "

      - echo "Writing appspec.yaml..."
      - |
        cat > appspec.yaml << 'EOF'
        version: 0.0
        Resources:
          - TargetService:
              Type: AWS::ECS::Service
              Properties:
                TaskDefinition: <TASK_DEFINITION>
                LoadBalancerInfo:
                  ContainerName: "Main"
                  ContainerPort: 8501
        EOF

artifacts:
  files:
    - imagedefinitions.json
    - taskdef.json
    - appspec.yaml
