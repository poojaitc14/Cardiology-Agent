[project]
name = "cardiology-clinical-agent"
version = "0.1.0"
description = "Cardiologist Clinical Patient Review and Decision-Support Agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0,<1.0",
    "uvicorn[standard]>=0.24.0,<1.0",
    "pydantic>=2.5,<3.0",
    "boto3>=1.34,<2.0",
    "httpx>=0.27,<1.0",
    "opensearch-py>=2.5,<3.0",
    "requests>=2.31,<3.0",
    "langfuse>=2.0.0,<3.0",
    "streamlit>=1.28.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "openai>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.21,<1.0",
    "mypy>=1.10,<2.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
