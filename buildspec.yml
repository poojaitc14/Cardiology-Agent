version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt

  pre_build:
    commands:
      # A non-zero pytest exit stops CodeBuild, so no image is built or pushed.
      - python -m pytest -v
      - TESTS_PASSED=true
      - test -n "$AWS_ACCOUNT_ID"
      - test -n "$AWS_DEFAULT_REGION"
      - test -n "$BACKEND_REPO_NAME"
      - test -n "$FRONTEND_REPO_NAME"
      - BACKEND_REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO_NAME"
      - FRONTEND_REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO_NAME"
      - COMMIT_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)"
      - test -n "$COMMIT_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

  build:
    commands:
      - test "$TESTS_PASSED" = "true"
      - docker build --file Dockerfile.backend --tag "$BACKEND_REPOSITORY_URI:$COMMIT_TAG" --tag "$BACKEND_REPOSITORY_URI:latest" .
      - docker build --file Dockerfile.frontend --tag "$FRONTEND_REPOSITORY_URI:$COMMIT_TAG" --tag "$FRONTEND_REPOSITORY_URI:latest" .

  post_build:
    commands:
      - test "$TESTS_PASSED" = "true"
      - docker push "$BACKEND_REPOSITORY_URI:$COMMIT_TAG"
      - docker push "$BACKEND_REPOSITORY_URI:latest"
      - docker push "$FRONTEND_REPOSITORY_URI:$COMMIT_TAG"
      - docker push "$FRONTEND_REPOSITORY_URI:latest"
      - printf '{"backendImageUri":"%s","frontendImageUri":"%s","imageTag":"%s"}\n' "$BACKEND_REPOSITORY_URI:$COMMIT_TAG" "$FRONTEND_REPOSITORY_URI:$COMMIT_TAG" "$COMMIT_TAG" > image-detail.json

artifacts:
  files:
    - image-detail.json
